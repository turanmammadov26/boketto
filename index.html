<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Карточки · 日本語</title>
<style>
:root{--bg:#fafafa;--fg:#111;--mut:#888;--line:rgba(127,127,127,.25);--acc:#111;--onacc:#fff;--btn:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--mut:#777;--acc:#eee;--onacc:#111;--btn:#1a1a1a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:var(--fg)}
button{cursor:pointer}
input,select{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--mut)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:28px}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.02em}
h1 span{color:var(--mut);font-weight:400}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mut);padding:6px 10px;border-radius:6px}
nav button.on{color:var(--fg);background:var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin-bottom:16px}
.card{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:16px;background:var(--btn);padding:24px;margin-bottom:16px}
.jp{font-size:56px;line-height:1.2;font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;word-break:keep-all}
.jp.sm{font-size:20px;display:inline}
.rd{color:var(--mut);margin-top:10px}
.ru{font-size:19px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{display:flex;flex-direction:column;gap:2px;padding:12px 4px;border:1px solid var(--line);border-radius:10px;background:var(--btn)}
.grid button small{color:var(--mut);font-size:12px}
.primary{background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:12px 16px}
.wide{width:100%;padding:14px}
kbd{font-size:12px;opacity:.6}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.empty small{display:block;margin-top:6px}
.empty.small{padding:20px 0}
.form{display:grid;gap:8px;margin-bottom:20px}
.row{display:flex;gap:8px}
.row>*:first-child{flex:1}
.search{width:100%;margin-bottom:12px}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item small{color:var(--mut);font-size:12px}
.item .rd{display:inline;margin:0 0 0 6px;font-size:13px}
.item .ru{font-size:15px;margin:2px 0 0}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.x:hover{color:var(--fg)}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}.jp{font-size:44px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>日本語 <span>карточки</span></h1>
    <nav>
      <button data-v="study" class="on">Учить</button>
      <button data-v="dict">Словарь</button>
      <button data-v="folders">Папки</button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<script>
const KEY='jpflash.v1', DAY=864e5;
const TG=window.Telegram?.WebApp;
const useCloud=!!(TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9'));

const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,9);

let S={folders:[],cards:[]};
let view='study', studyFolder='all', queue=[], revealed=false;
const dirty=new Set(), toDel=new Set(); let timer=null;

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.cards?d:null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const cs={
  keys:()=>new Promise(r=>TG.CloudStorage.getKeys((e,k)=>r(e?[]:k))),
  getMany:ks=>new Promise(r=>TG.CloudStorage.getItems(ks,(e,m)=>r(e?{}:m))),
  set:(k,v)=>new Promise(r=>TG.CloudStorage.setItem(k,v,(e,ok)=>r(!e&&ok))),
  del:k=>new Promise(r=>TG.CloudStorage.removeItem(k,(e,ok)=>r(!e&&ok))),
};
function markCard(id){toDel.delete('c:'+id);dirty.add('c:'+id)}
function markFolder(id){toDel.delete('f:'+id);dirty.add('f:'+id)}
function dropKey(k){dirty.delete(k);toDel.add(k)}
function changed(){saveLocal();if(useCloud){clearTimeout(timer);timer=setTimeout(flush,400)}}
async function flush(){
  if(!useCloud)return;
  const up=[...dirty], rm=[...toDel]; dirty.clear(); toDel.clear();
  for(const k of up){
    const id=k.slice(2), o=(k[0]==='c'?S.cards:S.folders).find(x=>x.id===id);
    if(!o)continue;
    if(!await cs.set(k,JSON.stringify(o)))dirty.add(k);
  }
  for(const k of rm){if(!await cs.del(k))toDel.add(k)}
  if(dirty.size||toDel.size)setTimeout(flush,2000);
}
async function loadCloud(){
  const ks=(await cs.keys()).filter(k=>/^[cf]:/.test(k));
  const folders=[], cards=[];
  for(let i=0;i<ks.length;i+=100){
    const m=await cs.getMany(ks.slice(i,i+100));
    for(const k in m){
      try{const o=JSON.parse(m[k]);(k[0]==='c'?cards:folders).push(o)}catch(e){}
    }
  }
  return {folders,cards};
}

function newCard(jp,rd,ru,folderId){return {id:uid(),folderId,jp,reading:rd,ru,seen:false,ease:2.5,ivl:0,reps:0,due:0}}
function seed(){
  const f={id:uid(),name:'Базовые'};
  const w=[['猫','ねこ','кошка'],['水','みず','вода'],['本','ほん','книга'],['学生','がくせい','студент'],['先生','せんせい','учитель'],['日本','にほん','Япония'],['食べる','たべる','есть'],['行く','いく','идти'],['大きい','おおきい','большой'],['ありがとう','','спасибо']];
  return {folders:[f],cards:w.map(([a,b,c])=>newCard(a,b,c,f.id))};
}
function queueFor(fid){
  const now=Date.now(), cs_=S.cards.filter(c=>fid==='all'||c.folderId===fid);
  const due=cs_.filter(c=>c.seen&&c.due<=now).sort((a,b)=>a.due-b.due).map(c=>c.id);
  const news=cs_.filter(c=>!c.seen).slice(0,20).map(c=>c.id);
  return [...due,...news];
}
function sched(c,q){
  const now=Date.now(), n={...c,seen:true};
  if(q===1){n.reps=0;n.ivl=0;n.due=now+6e4;return n}
  const g={2:3,3:4,4:5}[q];
  n.ease=Math.max(1.3,c.ease+0.1-(5-g)*(0.08+(5-g)*0.02));
  n.reps=c.reps+1;
  const base=n.reps===1?1:n.reps===2?3:c.ivl*n.ease;
  n.ivl=Math.max(1,Math.round(base*{2:1.2,3:1,4:1.3}[q]));
  n.due=now+n.ivl*DAY;
  return n;
}
function fmt(ms){
  if(ms<6e4)return '1 мин';
  if(ms<36e5)return Math.round(ms/6e4)+' мин';
  if(ms<DAY)return Math.round(ms/36e5)+' ч';
  return Math.round(ms/DAY)+' дн';
}
function rate(q){
  const id=queue[0], i=S.cards.findIndex(c=>c.id===id);
  if(i<0)return;
  S.cards[i]=sched(S.cards[i],q); markCard(id); changed();
  queue.shift(); if(q===1)queue.push(id);
  revealed=false; render();
}
function fname(id){return S.folders.find(f=>f.id===id)?.name||'—'}

function studyHTML(){
  const opts=[['all','Все папки'],...S.folders.map(f=>[f.id,f.name])]
    .map(([v,t])=>`<option value="${v}"${v===studyFolder?' selected':''}>${h(t)}</option>`).join('');
  let body;
  if(!queue.length){
    body=`<div class="empty">Всё повторено ✓<small>Новые карточки и повторы появятся позже</small></div>`;
  }else{
    const c=S.cards.find(x=>x.id===queue[0]);
    body=`<div class="card"><div class="jp">${h(c.jp)}</div>${revealed?`<div class="rd">${h(c.reading)}</div><div class="ru">${h(c.ru)}</div>`:''}</div>`+
    (revealed
      ?`<div class="grid">${[[1,'Снова'],[2,'Трудно'],[3,'Хорошо'],[4,'Легко']].map(([q,t])=>
          `<button data-act="rate" data-q="${q}"><b>${t}</b><small>${q===1?'1 мин':fmt(sched(c,q).due-Date.now())}</small></button>`).join('')}</div>`
      :`<button class="primary wide" data-act="reveal">Показать ответ <kbd>␣</kbd></button>`);
  }
  return `<div class="bar"><select id="fsel">${opts}</select><span>${queue.length} в очереди</span></div>${body}`;
}
function dictHTML(){
  const fo=S.folders.map(f=>`<option value="${f.id}">${h(f.name)}</option>`).join('');
  return `<form class="form" id="addf">
      <input id="f-jp" placeholder="Слово (漢字 / かな)" required>
      <input id="f-rd" placeholder="Чтение (необязательно)">
      <input id="f-ru" placeholder="Перевод" required>
      <div class="row"><select id="f-fo">${fo}</select><button class="primary" type="submit">Добавить</button></div>
    </form>
    <input class="search" id="q" placeholder="Поиск…">
    <div id="list"></div>`;
}
function drawList(){
  const q=($('#q')?.value||'').trim().toLowerCase();
  const rows=S.cards.filter(c=>!q||[c.jp,c.reading,c.ru].some(x=>x.toLowerCase().includes(q)));
  $('#list').innerHTML=rows.length
    ?`<div class="list">${rows.map(c=>`<div class="item"><div><div><span class="jp sm">${h(c.jp)}</span><span class="rd">${h(c.reading)}</span></div><div class="ru">${h(c.ru)}</div><small>${h(fname(c.folderId))}</small></div><button class="x" data-act="delc" data-id="${c.id}" title="Удалить">×</button></div>`).join('')}</div>`
    :`<div class="empty small">Пусто</div>`;
}
function foldersHTML(){
  const now=Date.now();
  const items=S.folders.map(f=>{
    const cs_=S.cards.filter(c=>c.folderId===f.id);
    const d=cs_.filter(c=>c.seen&&c.due<=now).length, n=cs_.filter(c=>!c.seen).length;
    return `<div class="item"><div><div>${h(f.name)}</div><small>${cs_.length} карточек · ${d} к повтору · ${n} новых</small></div><button class="x" data-act="delf" data-id="${f.id}" title="Удалить папку">×</button></div>`;
  }).join('');
  return `<form class="form row" id="addfo"><input id="nf" placeholder="Новая папка" required><button class="primary" type="submit">Создать</button></form>
    <div class="list">${items||'<div class="empty small">Папок нет</div>'}</div>`;
}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const app=$('#app');
  if(view==='study')app.innerHTML=studyHTML();
  else if(view==='dict'){app.innerHTML=dictHTML();drawList();}
  else app.innerHTML=foldersHTML();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-v]'); if(!b)return;
  if(b.dataset.v){
    view=b.dataset.v;
    if(view==='study'){queue=queueFor(studyFolder);revealed=false}
    render(); return;
  }
  const a=b.dataset.act;
  if(a==='reveal'){revealed=true;render()}
  else if(a==='rate')rate(+b.dataset.q);
  else if(a==='delc'){
    const id=b.dataset.id;
    S.cards=S.cards.filter(c=>c.id!==id);
    queue=queue.filter(i=>i!==id); dropKey('c:'+id); changed(); drawList();
  }
  else if(a==='delf'){
    const f=S.folders.find(x=>x.id===b.dataset.id); if(!f)return;
    if(!confirm(`Удалить папку «${f.name}» и все её карточки?`))return;
    S.cards.filter(c=>c.folderId===f.id).forEach(c=>dropKey('c:'+c.id));
    S.cards=S.cards.filter(c=>c.folderId!==f.id);
    S.folders=S.folders.filter(x=>x.id!==f.id); dropKey('f:'+f.id);
    if(studyFolder===f.id)studyFolder='all';
    queue=queueFor(studyFolder); changed(); render();
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='addf'){
    const jp=$('#f-jp').value.trim(), ru=$('#f-ru').value.trim();
    if(!jp||!ru)return;
    const c=newCard(jp,$('#f-rd').value.trim(),ru,$('#f-fo').value);
    S.cards.push(c); markCard(c.id); changed();
    ['#f-jp','#f-rd','#f-ru'].forEach(s=>$(s).value='');
    $('#f-jp').focus(); drawList();
  }else if(e.target.id==='addfo'){
    const n=$('#nf').value.trim(); if(!n)return;
    const f={id:uid(),name:n};
    S.folders.push(f); markFolder(f.id); changed(); render();
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q')drawList()});
document.addEventListener('change',e=>{
  if(e.target.id==='fsel'){studyFolder=e.target.value;queue=queueFor(studyFolder);revealed=false;render()}
});
document.addEventListener('keydown',e=>{
  if(view!=='study'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if((e.key===' '||e.key==='Enter')&&queue.length&&!revealed){e.preventDefault();revealed=true;render()}
  else if(revealed&&/^[1-4]$/.test(e.key)&&queue.length)rate(+e.key);
});
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||!useCloud||dirty.size||toDel.size)return;
  S=await loadCloud(); queue=queueFor(studyFolder); revealed=false; render();
});

function applyTheme(){
  const p=TG.themeParams||{}, st=document.documentElement.style;
  if(p.bg_color)st.setProperty('--bg',p.bg_color);
  if(p.text_color)st.setProperty('--fg',p.text_color);
  if(p.hint_color)st.setProperty('--mut',p.hint_color);
  if(p.secondary_bg_color)st.setProperty('--btn',p.secondary_bg_color);
  if(p.button_color)st.setProperty('--acc',p.button_color);
  if(p.button_text_color)st.setProperty('--onacc',p.button_text_color);
  st.setProperty('color-scheme',TG.colorScheme||'light');
}

async function init(){
  const local=loadLocal();
  if(useCloud){
    TG.ready(); TG.expand(); applyTheme();
    S=await loadCloud();
    if(!S.folders.length&&!S.cards.length){
      S=local||seed();
      S.folders.forEach(f=>markFolder(f.id));
      S.cards.forEach(c=>markCard(c.id));
      flush();
    }
  }else{
    S=local||seed();
  }
  saveLocal();
  queue=queueFor(studyFolder);
  render();
}
init();
</script>
</body>
</html>
